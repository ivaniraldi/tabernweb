<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity World | Simple MMO</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --text: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Auth Screen */
        #authScreen {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        h2 { margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: white;
            outline: none;
        }
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Game Screen */
        #gameScreen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        #world {
            width: 2000px;
            height: 2000px;
            position: absolute;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .player {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            transition: all 0.1s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        .player-name {
            position: absolute;
            top: -25px;
            font-size: 12px;
            white-space: nowrap;
            background: rgba(0,0,0,0.5);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* Chat Overlay */
        #chatOverlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 300px;
            height: 200px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            font-size: 14px;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        #chatInput {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 8px;
            color: white;
            display: none;
        }

        .stats {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.7);
            padding: 15px;
            border-radius: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="authScreen">
        <h2 id="authTitle">Iniciar Sesión</h2>
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="username" placeholder="Tu nombre">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button onclick="handleAuth()">Entrar al Mundo</button>
        <p style="margin-top: 16px; text-align: center; font-size: 14px; color: #94a3b8; cursor: pointer;" onclick="toggleAuthMode()" id="authToggle">
            ¿No tienes cuenta? Regístrate
        </p>
    </div>

    <div id="gameScreen">
        <div id="world"></div>
        <div class="stats">
            <div id="statName">Jugador: -</div>
            <div>Oro: <span id="statGold">0</span></div>
            <div>Exp: <span id="statExp">0</span></div>
        </div>
        <div id="chatOverlay">
            <div id="chatMessages"></div>
            <input type="text" id="chatInput" placeholder="Presiona Enter para enviar...">
        </div>
    </div>

    <script>
        let socket;
        let isRegister = false;
        let me = { id: null, x: 0, y: 0, name: '' };
        let players = {};
        const world = document.getElementById('world');
        const speed = 10;
        let keys = {};

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('authTitle').textContent = isRegister ? 'Registrarse' : 'Iniciar Sesión';
            document.getElementById('authToggle').textContent = isRegister ? 'Ya tengo cuenta' : '¿No tienes cuenta? Regístrate';
        }

        async function handleAuth() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();

                if (data.error) return alert(data.error);

                // For simplicity, we just log in if registered
                if (isRegister) {
                    isRegister = false;
                    return handleAuth();
                }

                initGame(data.user, data.token);
            } catch (e) { console.error(e); }
        }

        function initGame(userData, token) {
            me.id = userData.player.id;
            me.x = userData.player.x;
            me.y = userData.player.y;
            me.name = userData.username;

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('statName').textContent = `Jugador: ${me.name}`;
            document.getElementById('statGold').textContent = userData.player.gold;
            document.getElementById('statExp').textContent = userData.player.experience;

            connectWS();
            gameLoop();
        }

        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(`${protocol}//${location.host}`);

            socket.onopen = () => {
                socket.send(JSON.stringify({ type: 'login', playerId: me.id }));
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'player_joined' || data.type === 'player_moved') {
                    updateOtherPlayer(data);
                }
                if (data.type === 'player_left') {
                    removePlayer(data.playerId);
                }
                if (data.type === 'chat') {
                    addChatMessage(`${data.playerId === me.id ? 'Tú' : 'Jugador ' + data.playerId}: ${data.message}`);
                }
            };
        }

        function updateOtherPlayer(data) {
            if (data.playerId === me.id && data.type === 'player_moved') return;
            
            const id = data.player ? data.player.id : data.playerId;
            if (!players[id]) {
                const el = document.createElement('div');
                el.className = 'player';
                el.style.backgroundColor = data.player?.color || '#6366f1';
                el.innerHTML = `<span class="player-name">Jugador ${id}</span>`;
                world.appendChild(el);
                players[id] = { el, x: 0, y: 0 };
            }

            if (data.x !== undefined) {
                players[id].x = data.x;
                players[id].y = data.y;
                players[id].el.style.left = data.x + 'px';
                players[id].el.style.top = data.y + 'px';
            }
        }

        function removePlayer(id) {
            if (players[id]) {
                world.removeChild(players[id].el);
                delete players[id];
            }
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === 'Enter') toggleChat();
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function toggleChat() {
            const input = document.getElementById('chatInput');
            if (document.activeElement === input) {
                const msg = input.value.trim();
                if (msg) socket.send(JSON.stringify({ type: 'chat', message: msg }));
                input.value = '';
                input.style.display = 'none';
                input.blur();
            } else {
                input.style.display = 'block';
                input.focus();
            }
        }

        function gameLoop() {
            let moved = false;
            if (document.activeElement !== document.getElementById('chatInput')) {
                if (keys['w']) { me.y -= speed; moved = true; }
                if (keys['s']) { me.y += speed; moved = true; }
                if (keys['a']) { me.x -= speed; moved = true; }
                if (keys['d']) { me.x += speed; moved = true; }
            }

            if (moved) {
                // Update my position
                const myEl = document.getElementById('myPlayer') || createMyPlayer();
                myEl.style.left = me.x + 'px';
                myEl.style.top = me.y + 'px';
                
                // Camera follow
                world.style.transform = `translate(${680 - me.x}px, ${315 - me.y}px)`;
                
                // Send to server
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'move', x: me.x, y: me.y }));
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function createMyPlayer() {
            const el = document.createElement('div');
            el.id = 'myPlayer';
            el.className = 'player';
            el.style.backgroundColor = '#10b981';
            el.style.zIndex = '10';
            el.innerHTML = `<span class="player-name">${me.name} (Tú)</span>`;
            world.appendChild(el);
            return el;
        }

        function addChatMessage(msg) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.textContent = msg;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
